<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}

a-scene{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
}
</style>

<script>

AFRAME.registerComponent("freeze-once",{

init:function(){

this.frozen=false

this.el.addEventListener("targetFound",()=>{

if(this.frozen) return

const worldPos=new THREE.Vector3()
const worldQuat=new THREE.Quaternion()

this.el.object3D.getWorldPosition(worldPos)
this.el.object3D.getWorldQuaternion(worldQuat)

const model=document.querySelector("#model")

model.object3D.position.copy(worldPos)
model.object3D.quaternion.copy(worldQuat)

model.object3D.parent.remove(model.object3D)
document.querySelector("a-scene").object3D.add(model.object3D)

this.frozen=true

})

}

})

</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
embedded
renderer="precision: mediump; antialias:false"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="appleModel" src="apple.glb"></a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" freeze-once>

<a-gltf-model
id="model"
src="#appleModel"
position="0 -0.05 -0.35"
scale="0.12 0.12 0.12">
</a-gltf-model>

</a-entity>

</a-scene>

</body>
</html>
