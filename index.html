<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    /* Memastikan kamera menutupi seluruh layar */
    .mindar-ui-overlay { z-index: 100; }
  </style>
</head>

<body>
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; uiScanning: yes; filterMinCF:0.0001; filterBeta: 0.001;" 
    embedded 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-box position="0 0 0.3" scale="0.2 0.2 0.2" color="red"></a-box>
    </a-entity>
  </a-scene>
</body>>
</html>
