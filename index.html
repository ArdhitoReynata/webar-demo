<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}

a-scene{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
}
</style>

<script>

AFRAME.registerComponent("stable-transform",{
schema:{factor:{default:0.08}},

init:function(){

this.prevPos=new THREE.Vector3()
this.prevQuat=new THREE.Quaternion()

this.initialized=false
},

tick:function(){

const obj=this.el.object3D

if(!this.initialized){

this.prevPos.copy(obj.position)
this.prevQuat.copy(obj.quaternion)
this.initialized=true

}

this.prevPos.lerp(obj.position,this.data.factor)
obj.position.copy(this.prevPos)

this.prevQuat.slerp(obj.quaternion,this.data.factor)
obj.quaternion.copy(this.prevQuat)

}

})

</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
embedded
renderer="precision: mediump; antialias: false; colorManagement:true;"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item
id="appleModel"
src="apple.glb">
</a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model
src="#appleModel"
position="0 -0.05 -0.35"
scale="0.12 0.12 0.12"
stable-transform>
</a-gltf-model>

</a-entity>

</a-scene>

</body>
</html>
