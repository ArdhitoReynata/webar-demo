<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AR Experience - Loading Optimized</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; }
        
        /* Remove video borders and ensure proper fit */
        a-scene {
            background: transparent !important;
        }
        
        video {
            object-fit: cover !important;
            background: transparent !important;
        }
        
        /* Force video planes to fill completely */
        a-video {
            background: transparent !important;
        }
        
        a-video canvas {
            object-fit: cover !important;
        }
        
        /* Loading Screen */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        
        .loading-overlay.hidden { display: none; }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .loading-message {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.95;
        }
        
        .loading-progress {
            font-size: 48px;
            font-weight: bold;
            margin: 30px 0;
            letter-spacing: 2px;
        }
        
        .loading-detail {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 20px;
        }
        
        .loading-tip {
            font-size: 15px;
            opacity: 0.8;
            margin-top: 40px;
            max-width: 400px;
            text-align: center;
            line-height: 1.8;
        }
        
        .start-button {
            padding: 20px 60px;
            font-size: 22px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 50px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .start-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }
        
        .start-button:disabled {
            background: #999;
            color: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 1000;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .status-bar.tracking {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .status-bar.finished {
            background: rgba(33, 150, 243, 0.9);
        }
        
        /* Reset Button */
        .reset-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 1000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .reset-button:hover {
            background: rgba(244, 67, 54, 1);
            transform: scale(1.05);
        }
        
        .reset-button:active {
            transform: scale(0.95);
        }
        
        /* Hide AR until ready */
        #arScene {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        #arScene.ready {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-title">Mohon Tunggu</div>
        <div class="loading-message" id="loadingMessage">Sedang mempersiapkan...</div>
        <div class="loading-progress" id="loadingProgress">●</div>
        <div class="loading-detail" id="loadingDetail">Harap bersabar sebentar</div>
        <div class="loading-tip">
            Pastikan koneksi internet Anda stabil
        </div>
        <button class="start-button" id="startButton" disabled>
            Tunggu Sebentar...
        </button>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">Mencari marker...</div>
    
    <!-- Reset Button -->
    <div class="reset-button" id="resetButton">🔄 Reset ke Part 1</div>

    <!-- AR Scene -->
    <a-scene 
        id="arScene"
        mindar-image="
            imageTargetSrc: ./targets.mind;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
            warmupTolerance: 3;
            missTolerance: 5;
            maxTrack: 7;
        "
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
    >
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target 1 - Part 1 -->
        <a-entity id="target1" mindar-image-target="targetIndex: 0">
            <!-- Part 1 Container - 5 videos overlay bersamaan -->
            <a-entity id="video-container-part1" visible="false">
                <a-video id="video-laut" src="#vid-laut" position="0 0 0.1" height="1.5" width="1.5" material="shader: chromakey-advanced; src: #vid-laut; transparent: true; side: double"></a-video>
                <a-video id="video-kapal" src="#vid-kapal" position="0 0 0.20" height="1.5" width="1.5" material="shader: chromakey-advanced; src: #vid-kapal; transparent: true; side: double"></a-video>
                <a-video id="video-batu" src="#vid-batu" position="0 0 0.30" height="1.5" width="1.5" material="shader: chromakey-gentle; src: #vid-batu; transparent: true; side: double"></a-video>
                <a-video id="video-gelembung" src="#vid-gelembung" position="0 0 0.40" height="1.5" width="1.5" material="shader: chromakey-bubble; src: #vid-gelembung; transparent: true; side: double"></a-video>
                <a-video id="video-mascot" src="#vid-mascot" position="0 0 0.60" height="1.5" width="1.5" material="shader: chromakey-advanced; src: #vid-mascot; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>
        
        <!-- Target 2 - Part 2 -->
        <a-entity id="target2" mindar-image-target="targetIndex: 1">
            <!-- Part 2 Container - 5 videos overlay bersamaan -->
            <a-entity id="video-container-part2" visible="false">
                <a-video id="video-batu2" src="#vid-batu2" position="0 0.22 0.1" height="2" width="2" material="shader: chromakey-gentle; src: #vid-batu2; transparent: true; side: double"></a-video>
                <a-video id="video-orang" src="#vid-orang" position="0 0.22 0.20" height="2" width="2" material="shader: chromakey-advanced; src: #vid-orang; transparent: true; side: double"></a-video>
                <a-video id="video-gelembung2" src="#vid-gelembung2" position="0 0.22 0.25" height="2" width="2" material="shader: chromakey-bubble; src: #vid-gelembung2; transparent: true; side: double"></a-video>
                <a-video id="video-mascot2" src="#vid-mascot2" position="0 0.22 0.30" height="2" width="2" material="shader: chromakey-advanced; src: #vid-mascot2; transparent: true; side: double"></a-video>

                <a-video id="video-kapal3" src="#vid-kapal3" position="0 0 0.2" height="1" width="1" material="shader: chromakey-advanced; src: #vid-kapal3; transparent: true; side: double"></a-video>
                <a-video id="video-sikat" src="#vid-sikat" position="0 0 0.25" height="1" width="1" material="shader: chromakey-advanced; src: #vid-sikat; transparent: true; side: double"></a-video>

            <!-- Part 4 Container - 3 videos + 1 image overlay bersamaan -->
            <a-entity id="video-container-part4" visible="false">
                <a-video id="video-mascot4" src="#vid-mascot4" position="0 0 0.10" height="1" width="1" material="shader: chromakey-advanced; src: #vid-mascot4; transparent: true; side: double"></a-video>
                <a-video id="video-kapal4" src="#vid-kapal4" position="0 0 0.2" height="1" width="1" material="shader: chromakey-advanced; src: #vid-kapal4; transparent: true; side: double"></a-video>
                <a-image id="image-lumut4" src="#img-lumut4" position="0 0 0.23" height="1" width="1" material="transparent: true; alphaTest: 0.5"></a-image>

            </a-entity>
        </a-entity>
        
        <!-- Target 5 - Part 5 -->
        <a-entity id="target5" mindar-image-target="targetIndex: 4">
            <!-- Part 5 Container - 3 videos overlay bersamaan -->
            <a-entity id="video-container-part5" visible="false">
                <a-video id="video-kapal5" src="#vid-kapal5" position="0 0 0.10" height="1" width="1" material="shader: chromakey-advanced; src: #vid-kapal5; transparent: true; side: double"></a-video>
                <a-video id="video-orang5" src="#vid-orang5" position="0 0 0.2" height="1" width="1" material="shader: chromakey-advanced; src: #vid-orang5; transparent: true; side: double"></a-video>
                <a-video id="video-tangan" src="#vid-tangan" position="0 0 0.25" height="1" width="1" material="shader: chromakey-advanced; src: #vid-tangan; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>
        
        <!-- Target 6 - Part 6 -->
        <a-entity id="target6" mindar-image-target="targetIndex: 5">
            <!-- Part 6 Container - 4 videos overlay bersamaan -->
            <a-entity id="video-container-part6" visible="false">
                <a-video id="video-kapal6" src="#vid-kapal6" position="0 0 0.10" height="1" width="1" material="shader: chromakey-advanced; src: #vid-kapal6; transparent: true; side: double"></a-video>
                <a-video id="video-mascot6" src="#vid-mascot6" position="0 0 0.20" height="1" width="1" material="shader: chromakey-advanced; src: #vid-mascot6; transparent: true; side: double"></a-video>
                <a-video id="video-orang6" src="#vid-orang6" position="0 0 0.25" height="1" width="1" material="shader: chromakey-advanced; src: #vid-orang6; transparent: true; side: double"></a-video>
                <a-video id="video-gosok6" src="#vid-gosok6" position="0 0 0.30" height="1" width="1" material="shader: chromakey-advanced; src: #vid-gosok6; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>
        
        <!-- Target 7 - Part 7 -->
        <a-entity id="target7" mindar-image-target="targetIndex: 6">
            <!-- Part 7 Container - 4 videos overlay bersamaan -->
            <a-entity id="video-container-part7" visible="false">
                <a-video id="video-laut7" src="#vid-laut7" position="0 0 0.10" height="1" width="1" material="shader: chromakey-advanced; src: #vid-laut7; transparent: true; side: double"></a-video>
                <a-video id="video-coral7" src="#vid-coral7" position="0 0 0.20" height="1" width="1" material="shader: chromakey-advanced; src: #vid-coral7; transparent: true; side: double"></a-video>
                <a-video id="video-mascot7" src="#vid-mascot7" position="0 0 0.30" height="1" width="1" material="shader: chromakey-advanced; src: #vid-mascot7; transparent: true; side: double"></a-video>
                <a-video id="video-orang7" src="#vid-orang7" position="0 0 0.40" height="1" width="1" material="shader: chromakey-advanced; src: #vid-orang7; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <a-assets>
            <!-- Part 1 Videos - All 60fps, 15.1s, 1280x1280 -->
            <video id="vid-laut" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-batu" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- BATU SEAWEED-AV has embedded audio -->
            <video id="vid-gelembung" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-kapal" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-mascot" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 2 Videos - All 60fps, 15.1s, 1280x1280 -->
            <video id="vid-batu2" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- BATU SEAWEED-AV has embedded audio -->
            <video id="vid-gelembung2" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-mascot2" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-gosok" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-orang" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 3 Videos - All 60fps, 25.54s, 1280x1280 -->
            <video id="vid-kapal3" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- KAPAL SELAM-AV has embedded audio -->
            <video id="vid-mascot3" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-sikat" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 4 Videos - All 60fps, 12.07s, 1280x1280 -->
            <video id="vid-kapal4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- KAPAL SELAM-AV has embedded audio -->
            <video id="vid-mascot4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-sikat4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 5 Videos - All 60fps, 23.08s, 1280x1280 -->
            <video id="vid-kapal5" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- KAPAL SELAM-AV has embedded audio -->
            <video id="vid-orang5" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-tangan" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 6 Videos - All 60fps, 23.92s, 1280x1280 -->
            <video id="vid-kapal6" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-mascot6" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-orang6" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-gosok6" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- GOSOK GIGI-AV has embedded audio -->
            
            <!-- Part 7 Videos - All 60fps, 28.26s, 1280x1280 -->
            <video id="vid-coral7" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video><!-- CORAL-AV has embedded audio -->
            <video id="vid-laut7" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-mascot7" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-orang7" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            
            <!-- Part 4 Image -->
            <img id="img-lumut4" src="./compressed/LUMUT-v4.PNG" crossorigin="anonymous" />
            
            <!-- Audio files -->
            <audio id="sound-v1" src="./sound-v1.MP3" preload="auto"></audio>
            <audio id="sound-v2" src="./sound-v2.MP3" preload="auto"></audio>
            <audio id="sound-v3" src="./sound-v3.MP3" preload="auto"></audio>
            <audio id="sound-v4" src="./sound-v4.MP3" preload="auto"></audio>
            <audio id="sound-v5" src="./sound-v5.MP3" preload="auto"></audio>
            <audio id="sound-v6" src="./sound-v6.MP3" preload="auto"></audio>
            <audio id="sound-v7" src="./sound-v7.MP3" preload="auto"></audio>
        </a-assets>
    </a-scene>

    <script>
        // Dynamic cache-busting timestamp
        const cacheBuster = Date.now();
        
        // Set video sources with cache buster
        document.getElementById('vid-laut').src = `./compressed/LAUT-v1.mp4?t=${cacheBuster}`;
        document.getElementById('vid-batu').src = `./compressed/BATU SEAWEED-AV-v1.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-gelembung').src = `./compressed/GELEMBUNG-v1.mp4?t=${cacheBuster}`;
        document.getElementById('vid-kapal').src = `./compressed/KAPAL SELAM-v1.mp4?t=${cacheBuster}`;
        document.getElementById('vid-mascot').src = `./compressed/MASCOT-v1.mp4?t=${cacheBuster}`;
        
        document.getElementById('vid-batu2').src = `./compressed/BATU SEAWEED-AV-v2.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-gelembung2').src = `./compressed/GELEMBUNG-v2.mp4?t=${cacheBuster}`;
        document.getElementById('vid-mascot2').src = `./compressed/MASCOT-v2.mp4?t=${cacheBuster}`;
        document.getElementById('vid-gosok').src = `./compressed/GOSOK GIGI-v2.mp4?t=${cacheBuster}`;
        document.getElementById('vid-orang').src = `./compressed/ORANG-v2.mp4?t=${cacheBuster}`;
        
        document.getElementById('vid-kapal3').src = `./compressed/KAPAL SELAM-AV-v3.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-mascot3').src = `./compressed/MASCOT-v3.mp4?t=${cacheBuster}`;
        document.getElementById('vid-sikat').src = `./compressed/SIKAT GIGI-v3.mp4?t=${cacheBuster}`;
        
        document.getElementById('vid-kapal4').src = `./compressed/KAPAL SELAM-AV-v4.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-mascot4').src = `./compressed/MASCOT-v4.mp4?t=${cacheBuster}`;
        document.getElementById('vid-sikat4').src = `./compressed/SIKAT GIGI-v4.mp4?t=${cacheBuster}`;
        
        document.getElementById('vid-kapal5').src = `./compressed/KAPAL SELAM-AV-v5.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-orang5').src = `./compressed/ORANG-v5.mp4?t=${cacheBuster}`;
        document.getElementById('vid-tangan').src = `./compressed/TANGAN-v5.mp4?t=${cacheBuster}`;
        
        document.getElementById('vid-kapal6').src = `./compressed/KAPAL SELAM-v6.mp4?t=${cacheBuster}`;
        document.getElementById('vid-mascot6').src = `./compressed/MASCOT-v6.mp4?t=${cacheBuster}`;
        document.getElementById('vid-orang6').src = `./compressed/ORANG-v6.mp4?t=${cacheBuster}`;
        document.getElementById('vid-gosok6').src = `./compressed/GOSOK GIGI-AV-v6.mp4?t=${cacheBuster}`; // Has embedded audio
        
        document.getElementById('vid-coral7').src = `./compressed/CORAL-AV-v7.mp4?t=${cacheBuster}`; // Has embedded audio
        document.getElementById('vid-laut7').src = `./compressed/LAUT-v7.mp4?t=${cacheBuster}`;
        document.getElementById('vid-mascot7').src = `./compressed/MASCOT-v7.mp4?t=${cacheBuster}`;
        document.getElementById('vid-orang7').src = `./compressed/ORANG-v7.mp4?t=${cacheBuster}`;
        
        console.log('🔄 Cache buster applied:', cacheBuster);
        console.log('🎵 Videos with embedded audio: BATU-v1, BATU-v2, KAPAL-v3, KAPAL-v4, KAPAL-v5, GOSOK-v6, CORAL-v7');
        
        // Chromakey Shaders - Ultra Clean
        AFRAME.registerShader('chromakey-advanced', {
            schema: { src: {type: 'map'} },
            init: function(data) {
                const videoTexture = new THREE.VideoTexture(data.src);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                videoTexture.format = THREE.RGBAFormat;
                videoTexture.generateMipmaps = false;
                videoTexture.wrapS = THREE.ClampToEdgeWrapping;
                videoTexture.wrapT = THREE.ClampToEdgeWrapping;
                this.material = new THREE.ShaderMaterial({
                    uniforms: { tex: {value: videoTexture} },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D tex;
                        varying vec2 vUv;
                        void main() {
                            vec4 color = texture2D(tex, vUv);
                            
                            // Calculate green dominance
                            float greenDominance = color.g - max(color.r, color.b);
                            
                            // More aggressive green detection
                            float isGreen = 0.0;
                            
                            // Primary detection: strong green
                            if (color.g > 0.4 && color.g > color.r * 1.2 && color.g > color.b * 1.2) {
                                isGreen = 1.0;
                            }
                            
                            // Secondary detection: very strong green
                            if (color.g > 0.6 && greenDominance > 0.2) {
                                isGreen = 1.0;
                            }
                            
                            // Tertiary detection: catch edge greens
                            if (greenDominance > 0.15 && color.g > 0.35) {
                                isGreen = 1.0;
                            }
                            
                            // Calculate alpha with smooth edges
                            float alpha = 1.0 - isGreen;
                            
                            // Smooth transition for semi-transparent greens
                            if (greenDominance > 0.1 && greenDominance < 0.25 && color.g > 0.3) {

        // Audio fade-in function
        function fadeAudioIn(audio, duration) {
            const steps = 30;
            const stepDuration = duration / steps;
            const volumeStep = 1.0 / steps;
            let currentStep = 0;
            
            const fadeInterval = setInterval(() => {
                currentStep++;
                audio.volume = Math.min(currentStep * volumeStep, 1.0);
                
                if (currentStep >= steps) {
                    clearInterval(fadeInterval);
                    audio.volume = 1.0;
                }
            }, stepDuration);
        }
        
        // Audio fade-out function
        function fadeAudioOut(audio, duration) {
            const steps = 20;
            const stepDuration = duration / steps;
            const volumeStep = 1.0 / steps;
            let currentStep = steps;
            
            const fadeInterval = setInterval(() => {
                currentStep--;
                audio.volume = Math.max(currentStep * volumeStep, 0);
                
                if (currentStep <= 0) {
                    clearInterval(fadeInterval);
                    audio.volume = 0;
                    audio.pause();
                }
            }, stepDuration);
        }
