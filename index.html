<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #instruction {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      z-index: 10;
      font-family: sans-serif;
      border-radius: 30px;
      pointer-events: none;
      text-align: center;
      font-size: 14px;
      width: 80%;
    }
  </style>

  <script>
    AFRAME.registerComponent('mytap', {
      init: function () {
        const el = this.el;
        const frames = ["#frame1", "#frame2", "#frame3", "#frame2"];
        let i = 0;
        let animInterval = null;
        let playing = false;

        // PRELOAD: Paksa GPU nge-cache texture
        frames.forEach(frameId => {
          const texture = new THREE.TextureLoader().load(document.querySelector(frameId).src);
          el.sceneEl.renderer.initTexture(texture); // Cache di renderer
        });

        const start = () => {
          if (playing) return;
          playing = true;
          document.querySelector('#instruction').style.display = "none";

          animInterval = setInterval(() => {
            el.setAttribute("src", frames[i]);
            i = (i + 1) % frames.length;
          }, 120); // Sedikit dicepetin biar kerasa nyambung
        };

        const stop = () => {
          playing = false;
          if (animInterval) clearInterval(animInterval);
          el.setAttribute("src", "#target");
          i = 0;
          const ins = document.querySelector('#instruction');
          if (ins) ins.style.display = "block";
        };

        // KUNCI: Menambahkan stopPropagation dan preventDefault
        el.addEventListener('click', (evt) => {
          evt.preventDefault();    // Mencegah refresh bawaan browser
          evt.stopPropagation();   // Mencegah event naik ke atas
          console.log("LOG: Tap Berhasil, Animasi Jalan!");
          start();
        });

        const targetEntity = this.el.closest('a-entity[mindar-image-target]');
        if (targetEntity) {
          targetEntity.addEventListener("targetLost", stop);
        }
      }
    });
  </script>
</head>

<body>

  <div id="instruction">Scan Marker & Tap Objek AR</div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 30; warmupTolerance: 10;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true"
    renderer="antialias: true; colorManagement: true; precision: mediump;"> <a-assets>
      <img id="target" src="target.png">
      <img id="frame1" src="frame1.png">
      <img id="frame2" src="frame2.png">
      <img id="frame3" src="frame3.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
      raycaster="objects: .clickable; far: 10000;">
    </a-camera>

    <a-entity id="my-target" mindar-image-target="targetIndex: 0">
      <a-plane id="anim" class="clickable" mytap src="#target" width="1.5" height="1.5" position="0 0 0.1"
        material="transparent: true; shader: flat; alphaTest: 0.5; side: double;">
      </a-plane>
    </a-entity>

  </a-scene>

</body>

</html>
