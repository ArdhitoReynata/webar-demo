<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}
</style>

<script>

AFRAME.registerComponent("smooth-follow", {

init: function () {

this.targetPos = new THREE.Vector3()
this.targetQuat = new THREE.Quaternion()

this.object = this.el.object3D

},

tick: function () {

const marker = this.el.parentEl.object3D

marker.getWorldPosition(this.targetPos)
marker.getWorldQuaternion(this.targetQuat)

this.object.position.lerp(this.targetPos, 0.15)
this.object.quaternion.slerp(this.targetQuat, 0.15)

}

})

</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart:true; filterMinCF:0.0001; filterBeta:0.01;"
embedded
renderer="precision:mediump;antialias:false;logarithmicDepthBuffer:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="appleModel" src="apple.glb"></a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-entity
gltf-model="#appleModel"
scale="0.12 0.12 0.12"
smooth-follow>
</a-entity>

</a-entity>

</a-scene>

</body>
</html>
