<!DOCTYPE html>
<html>
<head>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind;
filterMinCF:0.00001;
filterBeta:0.001;"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>
<img id="target" src="target.png">
<img id="frame1" src="frame1.png">
<img id="frame2" src="frame2.png">
<img id="frame3" src="frame3.png">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="marker" mindar-image-target="targetIndex:0">

<a-plane
id="anim"
src="#target"
width="1.5"
height="1.5"
position="0 0 0.35"
material="transparent:true">
</a-plane>

</a-entity>

</a-scene>

<script>

window.addEventListener("load",()=>{

const marker = document.querySelector("#marker");
const plane = document.querySelector("#anim");
const scene = document.querySelector("a-scene");

const frames = ["#frame1","#frame2","#frame3","#frame2"];

let i=0;
let playing=false;
let spawned=false;
let worldPlane=null;

/* animasi */
function startAnimation(){

if(playing) return;

playing=true;

setInterval(()=>{
if(worldPlane){
worldPlane.setAttribute("src",frames[i]);
}
i=(i+1)%frames.length;

},150);

}

document.body.addEventListener("touchstart",startAnimation);
document.body.addEventListener("click",startAnimation);


/* marker ditemukan */
marker.addEventListener("targetFound",()=>{

if(spawned) return;

const pos=new THREE.Vector3();
const rot=new THREE.Quaternion();

plane.object3D.getWorldPosition(pos);
plane.object3D.getWorldQuaternion(rot);

/* clone objek */
worldPlane=plane.cloneNode(true);

scene.appendChild(worldPlane);

/* set posisi dunia */
worldPlane.object3D.position.copy(pos);
worldPlane.object3D.quaternion.copy(rot);

/* sembunyikan objek marker */
plane.setAttribute("visible",false);

spawned=true;

});

/* marker hilang */
marker.addEventListener("targetLost",()=>{

if(worldPlane){
worldPlane.setAttribute("visible",false);
}

});

});

</script>

</body>
</html>
