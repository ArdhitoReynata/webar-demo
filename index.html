<!DOCTYPE html>
<html>
<head>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; filterMinCF:0.001; filterBeta:0.01;"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<img id="target" src="target.png">
<img id="frame1" src="frame1.png">
<img id="frame2" src="frame2.png">
<img id="frame3" src="frame3.png">

</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-plane
id="anim"
src="#target"
width="1.5"
height="1.5"
position="0 0 0.25"
material="transparent:true">
</a-plane>

</a-entity>

</a-scene>

<script>

const frames = ["#frame1","#frame2","#frame3"];
let i = 0;
let playing = false;

const plane = document.querySelector("#anim");

function startAnimation(){

if(playing) return;

playing = true;

setInterval(()=>{

plane.setAttribute("src",frames[i]);

i = (i+1)%frames.length;

},150);

}

/* TAP LAYAR DI HP */
document.body.addEventListener("touchstart", startAnimation);

/* TAP DI DESKTOP */
document.body.addEventListener("click", startAnimation);

</script>

</body>
</html>
