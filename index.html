<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}

a-scene{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
}
</style>

<script>
AFRAME.registerComponent("smooth-object",{
schema:{factor:{default:0.15}},

init:function(){
this.targetPos=new THREE.Vector3()
this.currentPos=new THREE.Vector3()
},

tick:function(){

const object=this.el.object3D
this.targetPos.copy(object.position)

this.currentPos.lerp(this.targetPos,this.data.factor)

object.position.copy(this.currentPos)

}
})
</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
embedded
color-space="sRGB"
renderer="colorManagement:true;physicallyCorrectLights:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-light type="ambient" intensity="1"></a-light>

<a-assets>
<a-asset-item id="appleModel" src="apple.glb"></a-asset-item>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model
src="#appleModel"
position="0 -0.05 -0.35"
scale="0.12 0.12 0.12"
material="color:white"
smooth-object>
</a-gltf-model>

</a-entity>

</a-scene>

</body>
</html>
