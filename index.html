<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    /* Memastikan kamera menutupi seluruh layar */
    .mindar-ui-overlay { z-index: 100; }
  </style>
</head>

<body>
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; uiScanning: yes; uiLoading: yes; uiError: yes;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: false" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-sphere 
        color="red" 
        radius="0.1" 
        position="0 0 0.2"
        animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
      </a-sphere>
    </a-entity>
  </a-scene>
</body>
</html>
