<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}
</style>

<script>

AFRAME.registerComponent("pose-smoothing", {

init:function(){

this.prevPos=new THREE.Vector3()
this.prevQuat=new THREE.Quaternion()

this.initialized=false

},

tick:function(){

const obj=this.el.object3D

if(!this.initialized){

this.prevPos.copy(obj.position)
this.prevQuat.copy(obj.quaternion)

this.initialized=true
return

}

obj.position.lerp(this.prevPos,0.85)
obj.quaternion.slerp(this.prevQuat,0.85)

this.prevPos.copy(obj.position)
this.prevQuat.copy(obj.quaternion)

}

})

</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart:true; filterMinCF:0.0001; filterBeta:0.01;"
embedded
renderer="precision:mediump;antialias:false"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="appleModel" src="apple.glb"></a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" pose-smoothing>

<a-entity
gltf-model="#appleModel"
scale="0.12 0.12 0.12"
position="0 0 0">
</a-entity>

</a-entity>

</a-scene>

</body>
</html>
