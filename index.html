<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}
</style>

<script>

AFRAME.registerComponent("freeze-anchor",{

init:function(){

this.spawned=false

this.el.addEventListener("targetFound",()=>{

if(this.spawned) return

const markerObj=this.el.object3D

const pos=new THREE.Vector3()
const quat=new THREE.Quaternion()

markerObj.getWorldPosition(pos)
markerObj.getWorldQuaternion(quat)

const scene=document.querySelector("a-scene")

const newEntity=document.createElement("a-entity")

newEntity.setAttribute("gltf-model","#appleModel")
newEntity.setAttribute("scale","0.12 0.12 0.12")

scene.appendChild(newEntity)

newEntity.object3D.position.copy(pos)
newEntity.object3D.quaternion.copy(quat)

this.spawned=true

})

}

})

</script>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart:true;"
embedded
renderer="precision:mediump;antialias:false"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="appleModel" src="apple.glb"></a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" freeze-anchor>

</a-entity>

</a-scene>

</body>
</html>
